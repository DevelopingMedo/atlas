name: Review

on:
  pull_request:
  push:
    branches:
      - opencode

permissions:
  contents: read

jobs:
  translations:
    name: DE/EN-Konsistenz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Struktur und technische Konfiguration prüfen
        run: python3 scripts/check_translations.py
