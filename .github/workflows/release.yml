name: Atlas release

on:
  push:
    tags:
      - 'v*'
      - 'codex-*'
      - 'claude-*'
      - 'opencode-*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sprachpakete erstellen
        run: |
          set -euo pipefail
          for lang in DE EN; do
            test -d "$lang" || { echo "Sprachordner $lang fehlt"; exit 1; }
            (cd "$lang" && zip -qr "../atlas-$lang.zip" . -x '*.DS_Store')
          done
      - name: Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ATLAS_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$ATLAS_TAG" atlas-DE.zip atlas-EN.zip --verify-tag --generate-notes \
            --notes "Lizenz: https://github.com/${GH_REPO}/blob/${ATLAS_TAG}/LICENSE"
