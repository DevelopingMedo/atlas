name: Atlas release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build installation ZIP
        run: |
          git archive --format=zip --output=atlas.zip HEAD
          zip -d atlas.zip .gitignore LICENSE README.md '.github/*'
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ATLAS_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$ATLAS_TAG" atlas.zip --verify-tag --generate-notes \
            --notes "Lizenz: https://github.com/${GH_REPO}/blob/${ATLAS_TAG}/LICENSE"
